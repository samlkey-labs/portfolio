name: Deploy

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read
  pull-requests: write # SWA preview URL comments

env:
  DEPLOYMENT_NAME: portfolio-infra
  DEPLOYMENT_LOCATION: westeurope

jobs:
  infra:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        if: github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

  app:
    needs: infra
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy App
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        run: |
          # Names come from the param file so this works even before the first infra deploy has outputs
          rg=$(grep '^param resourceGroupName ' infra/main.bicepparam | cut -d"'" -f2)
          name=$(grep '^param staticWebAppName ' infra/main.bicepparam | cut -d"'" -f2)
          if [ -z "$rg" ] || [ -z "$name" ]; then
            echo "::error::Could not read resourceGroupName/staticWebAppName from infra/main.bicepparam"
            exit 1
          fi
          token=$(az staticwebapp secrets list --name "$name" --resource-group "$rg" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        run: |
          # Names come from the param file so this works even before the first infra deploy has outputs
          rg=$(grep '^param resourceGroupName ' infra/main.bicepparam | cut -d"'" -f2)
          name=$(grep '^param staticWebAppName ' infra/main.bicepparam | cut -d"'" -f2)
          if [ -z "$rg" ] || [ -z "$name" ]; then
            echo "::error::Could not read resourceGroupName/staticWebAppName from infra/main.bicepparam"
            exit 1
          fi
          token=$(az staticwebapp secrets list --name "$name" --resource-group "$rg" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
